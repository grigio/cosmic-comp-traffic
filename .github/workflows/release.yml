name: Arch package

# Builds an Arch Linux package of cosmic-comp for every upstream release tag
# (epoch-X.Y.Z), with the patches in patches/ applied on top, and attaches it
# to a GitHub release named after the upstream tag.
#
# Triggers
#   schedule         every 6 hours: build every tag >= MIN_VERSION that has no
#                    release yet (i.e. new upstream releases get picked up
#                    automatically, failed builds are retried)
#   workflow_dispatch build one specific tag, or every missing one
#   push to master    PKGBUILD / patches / this file changed: rebuild the newest
#                    tag and overwrite its release (pkgrel is derived from the
#                    number of commits touching PKGBUILD+patches, so pacman sees
#                    it as an upgrade)

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build, e.g. epoch-1.11.0. Leave empty to build every missing tag.'
        required: false
        type: string
      force:
        description: 'Rebuild and overwrite the release even if it already exists'
        required: false
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - PKGBUILD
      - 'patches/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: arch-package
  cancel-in-progress: false

env:
  UPSTREAM_REPO: pop-os/cosmic-comp
  # Oldest upstream tag that gets a package (the version this fork started from).
  MIN_VERSION: '1.10.0'

jobs:
  discover:
    name: Find upstream tags
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Plan builds
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          LATEST_ONLY: ${{ github.event_name == 'push' }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          upstream = os.environ["UPSTREAM_REPO"]
          min_version = os.environ.get("MIN_VERSION", "0.0.0")
          input_tag = (os.environ.get("INPUT_TAG") or "").strip()
          force = (os.environ.get("FORCE") or "").lower() == "true"
          latest_only = (os.environ.get("LATEST_ONLY") or "").lower() == "true"

          def vkey(version):
              return tuple(int(part) for part in version.split("."))

          ls = subprocess.run(
              ["git", "ls-remote", "--tags", "--refs",
               f"https://github.com/{upstream}.git", "refs/tags/epoch-*"],
              capture_output=True, text=True, check=True,
          ).stdout

          tags = {}
          for line in ls.splitlines():
              ref = line.split("\t")[1]
              tag = ref[len("refs/tags/"):]
              match = re.fullmatch(r"epoch-(\d+\.\d+\.\d+)", tag)
              if match:
                  tags[tag] = match.group(1)

          existing = set()
          rel = subprocess.run(
              ["gh", "release", "list", "--repo", os.environ["GITHUB_REPOSITORY"],
               "--limit", "200", "--json", "tagName", "--jq", ".[].tagName"],
              capture_output=True, text=True,
          )
          if rel.returncode == 0:
              existing = {line.strip() for line in rel.stdout.splitlines() if line.strip()}

          if input_tag:
              tag = input_tag if input_tag.startswith("epoch-") else f"epoch-{input_tag}"
              selected = [(tag, tag[len("epoch-"):])]
          elif latest_only:
              candidates = sorted(
                  ((t, v) for t, v in tags.items() if vkey(v) >= vkey(min_version)),
                  key=lambda item: vkey(item[1]),
              )
              selected = candidates[-1:]
          else:
              selected = sorted(
                  ((t, v) for t, v in tags.items()
                   if vkey(v) >= vkey(min_version) and (force or t not in existing)),
                  key=lambda item: vkey(item[1]),
              )

          matrix = [{"tag": tag, "version": version} for tag, version in selected]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
              out.write(f"count={len(matrix)}\n")
          print(f"{len(matrix)} build(s): {json.dumps(matrix)}")
          PY

  build:
    name: ${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: archlinux:base-devel
      options: --privileged
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      # git has to exist before checkout, otherwise actions/checkout falls back to
      # downloading a tarball and there is no history for the pkgrel calculation.
      - name: Bootstrap git
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git

      - uses: actions/checkout@v4
        with:
          # full history: pkgrel is derived from the commit count of PKGBUILD+patches
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm --needed --disable-download-timeout \
            cargo git just lld github-cli sudo seatd \
            fontconfig libdisplay-info libinput libxcb libxkbcommon mesa pixman systemd-libs wayland

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cargo-${{ matrix.tag }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ matrix.tag }}-
            cargo-

      - name: Build package
        env:
          COSMIC_COMP_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          pkgrel=$(git rev-list --count HEAD -- PKGBUILD patches)
          (( pkgrel >= 1 )) || pkgrel=1
          echo "building cosmic-comp $COSMIC_COMP_VERSION (pkgrel $pkgrel)"

          # Build in a scratch directory: makepkg's src/ would otherwise collide
          # with the cosmic-comp source tree of this fork.
          build_dir=/tmp/pkgbuild
          rm -rf "$build_dir"
          mkdir -p "$build_dir" /tmp/pkgout
          cp PKGBUILD "$build_dir/"
          cp -r patches "$build_dir/"

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$build_dir" /tmp/pkgout
          # --syncdeps resolves whatever the PKGBUILD asks for (including soname
          # deps such as libseat.so), so a new upstream dependency does not need a
          # workflow change.
          su builder -s /bin/bash -c \
            "cd '$build_dir' && COSMIC_COMP_VERSION='$COSMIC_COMP_VERSION' COSMIC_COMP_PKGREL='$pkgrel' \
             PKGDEST=/tmp/pkgout makepkg --syncdeps --noconfirm --force --cleanbuild"

          cp /tmp/pkgout/*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Collect package
        id: pkg
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          shopt -s nullglob
          files=( *.pkg.tar.zst )
          (( ${#files[@]} == 1 )) || { echo "expected exactly one package, found ${#files[@]}" >&2; exit 1; }
          # release assets cannot contain ':' (the epoch separator), drop the epoch
          asset="cosmic-comp-traffic-${files[0]#*:}"
          mv "${files[0]}" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          cat "$asset.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
          ASSET: ${{ steps.pkg.outputs.asset }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Mirror the upstream tag, so the release points at the upstream commit
          # instead of at a random commit of this fork.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "mirroring upstream tag $TAG"
            git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" "refs/tags/$TAG:refs/tags/$TAG"
            git push origin "refs/tags/$TAG"
          fi

          patch_list=$(
            { ls patches/common/*.patch 2>/dev/null; ls "patches/$VERSION"/*.patch 2>/dev/null; } |
              sed 's|^|* `|; s|$|`|' || true
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists, uploading assets"
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            notes=$(cat <<EOF
          Arch Linux package of upstream [cosmic-comp](https://github.com/$UPSTREAM_REPO) \`$TAG\`
          with the patches from this fork applied on top.

          ### Install

          \`\`\`sh
          gh release download $TAG -R $GITHUB_REPOSITORY -p '*.pkg.tar.zst*' -D /tmp/cosmic-comp-traffic
          cd /tmp/cosmic-comp-traffic && sha256sum -c ./*.pkg.tar.zst.sha256
          sudo pacman -U ./*.pkg.tar.zst
          \`\`\`

          or simply \`./scripts/install-latest.sh $TAG\`.

          The package is called \`cosmic-comp-traffic\`, provides/conflicts/replaces
          \`cosmic-comp\`, and installs the same files to the same paths, so it is a
          drop-in replacement. Takes effect at the next login.

          ### Patches

          Applied at build time:

          $patch_list

          Revert with \`sudo pacman -S cosmic-comp\`.
          EOF
            )
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "$notes" \
              --verify-tag
          fi
