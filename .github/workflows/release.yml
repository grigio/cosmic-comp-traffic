name: Release packages

# Builds Arch Linux and Fedora RPM packages of cosmic-comp for every upstream
# release tag (epoch-X.Y.Z), with the patches in patches/ applied on top, and
# attaches them to a GitHub release named after the upstream tag.
#
# Triggers
#   schedule         every 6 hours: build every tag >= MIN_VERSION that has no
#                    release yet (i.e. new upstream releases get picked up
#                    automatically, failed builds are retried)
#   workflow_dispatch build one specific tag, or every missing one
#   push to master    PKGBUILD / patches / spec / this file changed: rebuild the
#                    newest tag and overwrite its release

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build, e.g. epoch-1.11.0. Leave empty to build every missing tag.'
        required: false
        type: string
      force:
        description: 'Rebuild and overwrite the release even if it already exists'
        required: false
        type: boolean
        default: false
      source_ref:
        description: 'For pre-releases: upstream commit/branch/ref to build instead of a tag (tag input is required)'
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - PKGBUILD
      - cosmic-comp-traffic.spec
      - 'patches/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release-packages
  cancel-in-progress: false

env:
  UPSTREAM_REPO: pop-os/cosmic-comp
  # Oldest upstream tag that gets a package. Support for epoch-1.10.0 was
  # dropped; the oldest build target is epoch-1.11.0 (plus upstream master
  # pre-releases). Keep in sync with the fallback in scripts/check-patches.sh.
  MIN_VERSION: '1.11.0'

jobs:
  discover:
    name: Find upstream tags
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      latest_tag: ${{ steps.plan.outputs.latest_tag }}
    steps:
      # Needed to read patches/series and the version-specific patch dirs when
      # computing the effective patch list passed to every build/publish job.
      - uses: actions/checkout@v4

      - name: Plan builds
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          LATEST_ONLY: ${{ github.event_name == 'push' }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          upstream = os.environ["UPSTREAM_REPO"]
          min_version = os.environ.get("MIN_VERSION", "0.0.0")
          input_tag = (os.environ.get("INPUT_TAG") or "").strip()
          source_ref = (os.environ.get("SOURCE_REF") or "").strip()
          force = (os.environ.get("FORCE") or "").lower() == "true"
          latest_only = (os.environ.get("LATEST_ONLY") or "").lower() == "true"

          def vkey(version):
              return tuple(int(part) for part in version.split("."))

          def emit(matrix, latest_tag):
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"matrix={json.dumps(matrix)}\n")
                  out.write(f"count={len(matrix)}\n")
                  out.write(f"latest_tag={latest_tag}\n")
              print(f"{len(matrix)} build(s): {json.dumps(matrix)}")

          def effective_patches(version):
              """Ordered patch paths for this version, one per applied patch.

              Mirrors PKGBUILD / check-patches.sh: patches/series defines the
              order, patches/<version>/<name> replaces the common patch of the
              same name, and version-only patches are applied afterwards.
              A pre-release from an arbitrary upstream ref passes version=None
              so it uses the common series only (no stale version overrides).
              """
              common = Path("patches/common")
              vdir = Path("patches") / version if version else None
              series = Path("patches/series")
              if series.is_file():
                  names = ["".join(line.split("#", 1)[0].split())
                           for line in series.read_text().splitlines()]
                  names = [name for name in names if name]
              else:
                  names = sorted(p.name for p in common.glob("*.patch"))
              result, seen = [], set()
              for name in names:
                  patch = common / name
                  if not patch.is_file():
                      raise SystemExit(f"series lists a missing patch: {name}")
                  if vdir and (vdir / name).is_file():
                      patch = vdir / name
                  result.append(str(patch))
                  seen.add(name)
              if vdir and vdir.is_dir():
                  for patch in sorted(vdir.glob("*.patch")):
                      if patch.name not in seen:
                          result.append(str(patch))
              return result

          # A single explicit counter replaces the git-history-derived pkgrel /
          # RPM Release values: a rebase could make those go backwards.
          counter = int(Path("release-counter").read_text().strip())
          if counter < 1:
              raise SystemExit(f"release-counter must be >= 1 (got {counter})")

          release_tags = subprocess.run(
              ["gh", "release", "list", "--repo", os.environ["GITHUB_REPOSITORY"],
               "--limit", "200", "--json", "tagName", "--jq", ".[].tagName"],
              capture_output=True, text=True, check=False,
          )
          existing = set()
          if release_tags.returncode == 0:
              existing = {line.strip() for line in release_tags.stdout.splitlines() if line.strip()}

          def max_published_build():
              highest = 0
              for tag in existing:
                  assets = subprocess.run(
                      ["gh", "release", "view", tag,
                       "--repo", os.environ["GITHUB_REPOSITORY"],
                       "--json", "assets", "--jq", ".assets[].name"],
                      capture_output=True, text=True, check=False,
                  )
                  if assets.returncode != 0:
                      continue
                  for name in assets.stdout.splitlines():
                      match = (re.search(r"-(\d+)-x86_64\.pkg\.tar\.zst$", name)
                               or re.search(r"-(\d+)(?:\.[^.]+)*\.x86_64\.rpm$", name))
                      if match:
                          highest = max(highest, int(match.group(1)))
              return highest

          highest = max_published_build()
          if counter <= highest:
              raise SystemExit(
                  f"release-counter {counter} must exceed published build {highest}; "
                  "bump release-counter before rebuilding"
              )

          # Pre-release from an arbitrary upstream ref (no upstream tag exists yet).
          # The release tag is created in this repo at the dispatched ref, and the
          # GitHub "Latest" marker is left on the newest upstream release.
          if source_ref:
              m = re.fullmatch(r"epoch-(\d+\.\d+\.\d+)-rc\.(\d+)", input_tag)
              if not m:
                  raise SystemExit(
                      f"with source_ref, tag must be epoch-X.Y.Z-rc.N (got {input_tag!r})"
                  )
              base, rc = m.group(1), m.group(2)
              emit([{
                  "tag": input_tag,
                  "version": f"{base}.rc{rc}",
                  "rpm_version": f"{base}~rc{rc}",
                  "source_ref": source_ref,
                  "prerelease": True,
                  "patch_files": " ".join(effective_patches(None)),
                  "build_number": counter,
              }], "")
              raise SystemExit(0)

          ls = subprocess.run(
              ["git", "ls-remote", "--tags", "--refs",
               f"https://github.com/{upstream}.git", "refs/tags/epoch-*"],
              capture_output=True, text=True, check=True,
          ).stdout

          tags = {}
          for line in ls.splitlines():
              ref = line.split("\t")[1]
              tag = ref[len("refs/tags/"):]
              match = re.fullmatch(r"epoch-(\d+\.\d+\.\d+)", tag)
              if match:
                  tags[tag] = match.group(1)

          supported = sorted(
              ((t, v) for t, v in tags.items() if vkey(v) >= vkey(min_version)),
              key=lambda item: vkey(item[1]),
          )
          # Newest tag we are willing to build, used to keep the GitHub
          # "Latest" marker on the newest release even when an older release is
          # republished later.
          latest_tag = supported[-1][0] if supported else ""

          if input_tag:
              tag = input_tag if input_tag.startswith("epoch-") else f"epoch-{input_tag}"
              if not re.fullmatch(r"epoch-\d+\.\d+\.\d+", tag):
                  raise SystemExit(f"invalid tag: {tag}")
              if tag not in tags:
                  raise SystemExit(f"tag not found upstream: {tag}")
              selected = [(tag, tag[len("epoch-"):])]
          elif latest_only:
              selected = supported[-1:]
          else:
              selected = [(t, v) for t, v in supported if force or t not in existing]

          matrix = [{
              "tag": tag,
              "version": version,
              "rpm_version": version,
              "source_ref": "",
              "prerelease": False,
              "patch_files": " ".join(effective_patches(version)),
              "build_number": counter,
          } for tag, version in selected]
          emit(matrix, latest_tag)
          PY

  build-arch:
    name: Arch - ${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: archlinux:base-devel
      options: --privileged
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      # git has to exist before checkout, otherwise actions/checkout falls back to
      # downloading a tarball and there is no history for the pkgrel calculation.
      - name: Bootstrap git
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify patches apply to pre-release ref
        if: matrix.prerelease
        env:
          SOURCE_REF: ${{ matrix.source_ref }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # check-patches.sh needs the ref locally; FETCH_HEAD works for both
          # branch names and SHAs and avoids assuming a local ref name.
          git fetch --no-tags --quiet "https://github.com/$UPSTREAM_REPO.git" "$SOURCE_REF"
          ./scripts/check-patches.sh --offline --ref FETCH_HEAD

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm --needed --disable-download-timeout \
            cargo git just lld github-cli sudo seatd \
            fontconfig libdisplay-info libinput libxcb libxkbcommon mesa pixman systemd-libs wayland

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cargo-arch-${{ matrix.tag }}-${{ github.run_id }}
          restore-keys: |
            cargo-arch-${{ matrix.tag }}-
            cargo-arch-

      - name: Build Arch package
        env:
          COSMIC_COMP_VERSION: ${{ matrix.version }}
          COSMIC_COMP_SOURCE_REF: ${{ matrix.source_ref }}
          PKGREL: ${{ matrix.build_number }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          pkgrel=$PKGREL
          (( pkgrel >= 1 )) || { echo "invalid pkgrel: $pkgrel" >&2; exit 1; }
          echo "building cosmic-comp $COSMIC_COMP_VERSION (pkgrel $pkgrel)"

          # Build in a scratch directory: makepkg's src/ would otherwise collide
          # with the cosmic-comp source tree of this fork.
          build_dir=/tmp/pkgbuild
          rm -rf "$build_dir"
          mkdir -p "$build_dir" /tmp/pkgout
          cp PKGBUILD release-counter "$build_dir/"
          cp -r patches "$build_dir/"

          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          # the cargo cache is restored as root; cargo runs as builder
          mkdir -p /home/builder/.cargo
          chown -R builder:builder /home/builder "$build_dir" /tmp/pkgout
          # --syncdeps resolves whatever the PKGBUILD asks for (including soname
          # deps such as libseat.so), so a new upstream dependency does not need a
          # workflow change.
          su builder -s /bin/bash -c \
            "cd '$build_dir' && COSMIC_COMP_VERSION='$COSMIC_COMP_VERSION' COSMIC_COMP_PKGREL='$pkgrel' \
             COSMIC_COMP_SOURCE_REF='$COSMIC_COMP_SOURCE_REF' \
             PKGDEST=/tmp/pkgout makepkg --syncdeps --noconfirm --force --cleanbuild"

          cp /tmp/pkgout/*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Collect Arch packages
        id: pkg
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          shopt -s nullglob
          files=(*.pkg.tar.zst)
          (( ${#files[@]} )) || { echo "no package was produced" >&2; exit 1; }
          for file in "${files[@]}"; do
            # release assets cannot contain ':' (the epoch separator), drop the epoch
            asset="${file/1:/}"
            [ "$asset" = "$file" ] || mv "$file" "$asset"
          done

      - name: Upload Arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages-${{ matrix.tag }}
          path: |
            *.pkg.tar.zst
          retention-days: 7

  build-rpm:
    name: Fedora RPM - ${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: fedora:latest
      options: --privileged
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Bootstrap git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc just lld \
            libdisplay-info-devel wayland-devel libinput-devel pixman-devel \
            mesa-libgbm-devel libxkbcommon-devel libseat-devel systemd-devel \
            pkgconfig rpm-build rpm-sign dnf-plugins-core rust-packaging

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Install Rust toolchain for builder user
        run: |
          su builder -s /bin/bash -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
            source "$HOME/.cargo/env"
            rustup toolchain install stable --component rust-src
            rustup default stable
          '

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          # Stable key so a successful build is actually restored next time.
          # The old key used github.run_id, which is unique per run and made
          # every RPM build re-download all cargo dependencies from scratch.
          key: cargo-rpm-${{ matrix.tag }}
          restore-keys: |
            cargo-rpm-

      - name: Set up rpmbuild directories
        run: |
          mkdir -p /home/builder/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          chown -R builder:builder /home/builder/rpmbuild

      - name: Download upstream source tarball
        env:
          VERSION: ${{ matrix.rpm_version }}
          SOURCE_REF: ${{ matrix.source_ref }}
        run: |
          set -euo pipefail
          cd /home/builder/rpmbuild/SOURCES
          if [[ -n $SOURCE_REF ]]; then
            # Pre-release: GitHub archives any commit/branch at this URL and
            # extracts it to cosmic-comp-<ref>.
            name="cosmic-comp-${SOURCE_REF}"
            curl -L -o "${name}.tar.gz" \
              "https://github.com/$UPSTREAM_REPO/archive/${SOURCE_REF}.tar.gz"
          else
            name="cosmic-comp-epoch-${VERSION}"
            curl -L -o "${name}.tar.gz" \
              "https://github.com/$UPSTREAM_REPO/archive/refs/tags/epoch-${VERSION}.tar.gz"
          fi

      - name: Copy spec file and patches
        env:
          PATCH_FILES: ${{ matrix.patch_files }}
        run: |
          set -euo pipefail
          spec=/home/builder/rpmbuild/SPECS/cosmic-comp-traffic.spec
          sources=/home/builder/rpmbuild/SOURCES
          cp "$GITHUB_WORKSPACE/cosmic-comp-traffic.spec" "$spec"

          # Copy exactly the effective patch set: common patches, version
          # overrides, and version extras (e.g. the 1.11.0 clippy patch).
          read -ra patches <<< "$PATCH_FILES"
          (( ${#patches[@]} )) || { echo "no patches to apply" >&2; exit 1; }
          for patch in "${patches[@]}"; do
            cp "$GITHUB_WORKSPACE/$patch" "$sources/"
          done

          # rpmbuild only applies what the spec declares. Rewrite the two
          # generated blocks so declarations and %patch lines always match the
          # files copied above -- for tags and master pre-releases alike.
          python3 - "$spec" "${patches[@]}" <<'PY'
          import re, sys

          path = sys.argv[1]
          names = [p.replace("\\", "/").rsplit("/", 1)[-1] for p in sys.argv[2:]]
          text = open(path).read()
          declarations = "\n".join(
              f"Patch{i}:         {name}" for i, name in enumerate(names)
          )
          applications = "\n".join(
              f"git apply --whitespace=nowarn -p1 %{{_sourcedir}}/{name}" for name in names
          )

          text, n = re.subn(
              r"(# >>> RPM PATCH DECLARATIONS).*?(# <<< RPM PATCH DECLARATIONS)",
              lambda m: f"{m.group(1)}\n{declarations}\n{m.group(2)}",
              text,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("missing RPM patch declaration markers in spec")
          text, n = re.subn(
              r"(# >>> RPM PATCH APPLICATION).*?(# <<< RPM PATCH APPLICATION)",
              lambda m: f"{m.group(1)}\n{applications}\n{m.group(2)}",
              text,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("missing RPM patch application markers in spec")
          with open(path, "w") as f:
              f.write(text)
          print(f"spec declares/applies {len(names)} patches")
          PY

          # Replace build date placeholder with current date in RPM format
          build_date=$(date +"%a %b %d %Y")
          sed -i "s/@@BUILD_DATE@@/$build_date/" "$spec"
          chown -R builder:builder /home/builder/rpmbuild

      - name: Build RPM package
        env:
          VERSION: ${{ matrix.rpm_version }}
          SOURCE_REF: ${{ matrix.source_ref }}
          RELEASE_NUMBER: ${{ matrix.build_number }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          release=$RELEASE_NUMBER
          (( release >= 1 )) || { echo "invalid release: $release" >&2; exit 1; }
          echo "building cosmic-comp-traffic $VERSION (release $release)"

          # Quotes are embedded in the string passed to the builder's shell so
          # each --define keeps its argument with a space intact.
          extra_defines=""
          if [[ -n $SOURCE_REF ]]; then
            extra_defines="--define \"cosmic_source_tar cosmic-comp-${SOURCE_REF}.tar.gz\" \
              --define \"cosmic_source_dir cosmic-comp-${SOURCE_REF}\""
          fi

          su builder -s /bin/bash -c \
            "cd /home/builder/rpmbuild && rpmbuild -ba \
              --define \"_topdir /home/builder/rpmbuild\" \
              --define \"version $VERSION\" \
              --define \"cosmic_release $release\" \
              $extra_defines \
              SPECS/cosmic-comp-traffic.spec"

      - name: Collect RPM packages
        id: pkg
        run: |
          set -euo pipefail
          cd /home/builder/rpmbuild/RPMS/x86_64
          shopt -s nullglob
          files=(*.rpm)
          (( ${#files[@]} )) || { echo "no RPM package was produced" >&2; exit 1; }
          printf '%s\n' "${files[@]}" > /tmp/assets-rpm.txt
          cat /tmp/assets-rpm.txt

      - name: Copy RPM packages to workspace
        run: |
          cp /home/builder/rpmbuild/RPMS/x86_64/*.rpm "$GITHUB_WORKSPACE/"

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-${{ matrix.tag }}
          path: |
            *.rpm
          retention-days: 7

  publish:
    name: Publish release - ${{ matrix.tag }}
    needs: [discover, build-arch, build-rpm]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Arch artifacts
        uses: actions/download-artifact@v4
        with:
          name: arch-packages-${{ matrix.tag }}
          path: arch-artifacts/

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpm-packages-${{ matrix.tag }}
          path: rpm-artifacts/

      - name: Collect all assets
        id: assets
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          assets=()
          # Only the main packages are published: no .sha256 files and no
          # -debug / -debuginfo / -debugsource packages.
          for file in arch-artifacts/*.pkg.tar.zst; do
            [ -e "$file" ] || continue
            case "$file" in
              *-debug-*.pkg.tar.zst) continue ;;
            esac
            # The Arch job already stripped the epoch separator from the asset
            # name (GitHub disallows ':'), so only rename when it is still
            # present. Otherwise mv tries to rename the file to itself.
            asset="${file/1:/}"
            if [[ "$asset" != "$file" ]]; then
              mv "$file" "$asset"
            fi
            assets+=("$asset")
          done
          for file in rpm-artifacts/*.rpm; do
            [ -e "$file" ] || continue
            base=$(basename "$file")
            case "$base" in
              *debuginfo*|*debugsource*) continue ;;
            esac
            mv "$file" .
            assets+=("$base")
          done
          (( ${#assets[@]} )) || { echo "no packages were produced" >&2; exit 1; }
          printf '%s\n' "${assets[@]}" > /tmp/assets.txt
          cat /tmp/assets.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
          SOURCE_REF: ${{ matrix.source_ref }}
          PRERELEASE: ${{ matrix.prerelease }}
          LATEST_TAG: ${{ needs.discover.outputs.latest_tag }}
          PATCH_FILES: ${{ matrix.patch_files }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          mapfile -t assets < /tmp/assets.txt
          echo "assets: ${assets[*]}"

          # Mirror the upstream tag, so the release points at the upstream commit
          # instead of at a random commit of this fork.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [[ -n $SOURCE_REF ]]; then
              echo "creating pre-release tag $TAG at $(git rev-parse --short HEAD)"
              git tag -a "$TAG" -m "Pre-release from upstream $SOURCE_REF"
              git push origin "refs/tags/$TAG"
            else
              echo "mirroring upstream tag $TAG"
              git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" "refs/tags/$TAG:refs/tags/$TAG"
              git push origin "refs/tags/$TAG"
            fi
          fi

          # List only the patches actually applied by the Arch/RPM builds.
          # PATCH_FILES is the effective list computed in discover (series with
          # version overrides substituted, plus version extras), not a glob of
          # everything under patches/, so unused/overridden files are omitted.
          read -ra effective_patches <<< "$PATCH_FILES"
          patch_list=$(printf '%s\n' "${effective_patches[@]}" | sed 's|^|* `|; s|$|`|')

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists, uploading assets"
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            notes=$(cat <<'EOF'
            {{PRERELEASE_NOTICE}}Arch Linux and Fedora RPM packages of upstream [cosmic-comp](https://github.com/{{UPSTREAM_REPO}}) `{{TAG}}`
            with the patches from this fork applied on top.

            ### Install

            **Arch Linux:**
            ```sh
            gh release download {{TAG}} -R {{GITHUB_REPOSITORY}} -p 'cosmic-comp-traffic-[0-9]*.pkg.tar.zst' -D /tmp/cosmic-comp-traffic
            sudo pacman -U /tmp/cosmic-comp-traffic/*.pkg.tar.zst
            ```

            **Fedora:**
            ```sh
            gh release download {{TAG}} -R {{GITHUB_REPOSITORY}} -p 'cosmic-comp-traffic-[0-9]*.rpm' -D /tmp/cosmic-comp-traffic
            sudo dnf install /tmp/cosmic-comp-traffic/*.rpm
            ```

            or simply `./scripts/install-latest.sh {{TAG}}`.

            The package is called `cosmic-comp-traffic`, provides/conflicts/replaces
            `cosmic-comp`, and installs the same files to the same paths, so it is a
            drop-in replacement. Takes effect at the next login.

            ### Patches

            Applied at build time:

            {{PATCH_LIST}}

            Revert with `sudo pacman -S cosmic-comp` (Arch) or `sudo dnf install cosmic-comp` (Fedora).
          EOF
            )
            # Replace template variables
            notes="${notes//\{\{UPSTREAM_REPO\}\}/$UPSTREAM_REPO}"
            notes="${notes//\{\{TAG\}\}/$TAG}"
            notes="${notes//\{\{GITHUB_REPOSITORY\}\}/$GITHUB_REPOSITORY}"
            notes="${notes//\{\{PATCH_LIST\}\}/$patch_list}"
            if [[ "${PRERELEASE,,}" == "true" ]]; then
              final_version=${VERSION%%.rc*}
              prerelease_notice=$(printf \
                '> **Pre-release** built from upstream `%s` (not yet tagged upstream).\n> Expect changes before the final %s release.\n\n' \
                "$SOURCE_REF" "$final_version")
            else
              prerelease_notice=""
            fi
            notes="${notes//\{\{PRERELEASE_NOTICE\}\}/$prerelease_notice}"

            prerelease_flag=()
            if [[ "${PRERELEASE,,}" == "true" ]]; then
              prerelease_flag=(--prerelease)
            fi
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "$notes" \
              "${prerelease_flag[@]}" \
              --verify-tag
          fi

          if [[ "${PRERELEASE,,}" == "true" ]]; then
            gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          fi

          # GitHub's "Latest" marker follows the most recently published
          # release, so rebuilding an older tag can steal it. Pin it back to
          # the newest upstream tag we build.
          if [[ -n $LATEST_TAG && $TAG == "$LATEST_TAG" ]]; then
            echo "marking $TAG as latest"
            gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Prune older Arch pkgrel assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
          PKGREL: ${{ matrix.build_number }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # Same counter as the build step, so "older" means strictly below the
          # pkgrel this run just uploaded.
          pkgrel=$PKGREL

          # Rebuilding a tag used to leave every previous pkgrel behind, so
          # `gh release download -p '*.pkg.tar.zst'` fetched several builds.
          # Only the main package of the current pkgrel is published now; this
          # also removes leftover older packages, debug packages and sha256
          # files published before that policy.
          stale=$(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' |
              PKGREL="$pkgrel" VERSION="$VERSION" python3 -c '
          import os, re, sys

          pattern = re.compile(
              r"^(cosmic-comp-traffic(-debug)?)-"
              + re.escape(os.environ["VERSION"])
              + r"-(\d+)-x86_64\.pkg\.tar\.zst(\.sha256)?$"
          )
          keep = int(os.environ["PKGREL"])
          for name in sys.stdin.read().split():
              match = pattern.match(name)
              if match and int(match.group(3)) < keep:
                  print(name)
          '
          )

          if [ -z "$stale" ]; then
            echo "no stale Arch assets for $TAG-$pkgrel"
            exit 0
          fi
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            echo "deleting $asset (older pkgrel than $pkgrel)"
            gh release delete-asset "$TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done <<<"$stale"

      - name: Prune older RPM release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.rpm_version }}
          RELEASE_NUMBER: ${{ matrix.build_number }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # Same counter as the build step
          release=$RELEASE_NUMBER

          stale=$(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' |
              RELEASE="$release" VERSION="$VERSION" python3 -c '
          import os, re, sys

          pattern = re.compile(
              r"^(cosmic-comp-traffic(-debuginfo|-debugsource)?-)"
              + re.escape(os.environ["VERSION"])
              + r"-(\d+)(\..*)?\.rpm(\.sha256)?$"
          )
          keep = int(os.environ["RELEASE"])
          for name in sys.stdin.read().split():
              match = pattern.match(name)
              if match and int(match.group(3)) < keep:
                  print(name)
          '
          )

          if [ -z "$stale" ]; then
            echo "no stale RPM assets for $TAG-$release"
            exit 0
          fi
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            echo "deleting $asset (older release than $release)"
            gh release delete-asset "$TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done <<<"$stale"