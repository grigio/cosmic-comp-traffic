# Metadata read by flake.nix with builtins.fromTOML at evaluation time.
# flake.lock still pins the actual revisions of nixpkgs, flake-parts and
# nix-filter; the url below is documentation for tools that look here.

[nixpkgs]
url = "github:NixOS/nixpkgs/nixos-unstable"
allowUnfree = true

[system]
# Target system (override in CI matrix)
default = "x86_64-linux"

[packages]
# The canonical package name exposed by the flake
default = "cosmic-comp-traffic"

[package]
# Upstream epoch this fork currently targets. Used as the Nix package version
# instead of a git hash or a literal "dirty".
version = "1.11.0"

[devShells]
default = [
  "rustc",
  "cargo",
  "pkg-config",
]

[experimental-features]
flakes = true

[flake-parts]
enabled = true

[nix-filter]
enabled = true
